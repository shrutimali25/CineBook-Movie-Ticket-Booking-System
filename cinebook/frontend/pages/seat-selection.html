<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seat Selection – CineBook</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Main CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="../index.html" class="nav-brand">
            <i class="fa-solid fa-film"></i>
            <span>Cine<span class="logo-highlight">Book</span></span>
        </a>
        <ul class="nav-links">
            <li>
                <a href="../index.html" class="nav-link">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>
            </li>
            <li>
                <a href="movies.html" class="nav-link">
                    <i class="fa-solid fa-film"></i>
                    <span>Movies</span>
                </a>
            </li>
            <li>
                <a href="my-bookings.html" class="nav-link">
                    <i class="fa-solid fa-ticket"></i>
                    <span>My Bookings</span>
                </a>
            </li>
            <li id="navAuthContainer">
                <a href="login.html" class="btn-nav-auth">
                    <i class="fa-solid fa-user"></i> Login
                </a>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <!-- Back Link & Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
            <a href="movie-details.html" class="btn btn-outline" style="font-size: 0.85rem;">
                <i class="fa-solid fa-arrow-left"></i> Change Showtime
            </a>
            <div id="seatSelectionShowInfo" style="text-align: right;">
                <!-- Show details injected by seats.js -->
            </div>
        </div>

        <!-- Cinema Theater Card -->
        <div style="background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 2.5rem 1.5rem; box-shadow: var(--shadow-md);">
            
            <!-- Screen Representation -->
            <div class="screen-container">
                <div class="cinema-screen"></div>
                <div class="screen-text">
                    <i class="fa-solid fa-display"></i> ALL EYES THIS WAY • THEATER SCREEN
                </div>
            </div>

            <!-- Seat Legend -->
            <div class="seat-legend">
                <div class="legend-item">
                    <div class="legend-box legend-available"></div>
                    <span>Available</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box legend-selected"></div>
                    <span>Selected</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box legend-booked"></div>
                    <span>Booked</span>
                </div>
            </div>

            <!-- Seats Layout Matrix -->
            <div class="seats-layout" id="seatsLayoutContainer">
                <!-- Dynamically rendered 5x5 grid A1-E5 by seats.js -->
            </div>

            <!-- Booking Summary Action Bar -->
            <div class="booking-bar">
                <div class="booking-bar-info">
                    <div class="bar-stat">
                        <span class="bar-stat-label">Selected Seats</span>
                        <span class="bar-stat-value highlight" id="selectedSeatsDisplay">None</span>
                    </div>
                    <div class="bar-stat">
                        <span class="bar-stat-label">Tickets</span>
                        <span class="bar-stat-value" id="ticketsCountDisplay">0</span>
                    </div>
                    <div class="bar-stat">
                        <span class="bar-stat-label">Total Price</span>
                        <span class="bar-stat-value highlight" id="totalPriceDisplay">₹0</span>
                    </div>
                </div>

                <button class="btn btn-primary" id="btnContinueBooking" disabled style="padding: 0.8rem 2rem; font-size: 1.05rem;">
                    CONTINUE <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div>&copy; 2026 CineBook – Interactive Seat Selection</div>
    </footer>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/seats.js"></script>
</body>
</html>
