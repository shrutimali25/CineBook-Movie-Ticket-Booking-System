# ============================================================
# CineBook - Spring Boot Application Configuration
# ============================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=CineBook

# ============================================================
# MySQL Database Configuration
# ============================================================
# IMPORTANT: Replace YOUR_PASSWORD below with your actual local MySQL password!
# Make sure you have created the database first:
# CREATE DATABASE cinebook_db;
spring.datasource.url=jdbc:mysql://localhost:3306/cinebook_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA & Hibernate Configuration
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Initialize sample data on startup (if data.sql is used)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
